[project]
name = "needle-see"
version = "0.1.0"
description = "A visual graft for Cactus Needle 3: typed decisions about images without a VLM"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "jax",
    "flax>=0.10.2",
    "optax",
    "safetensors",
    "sentencepiece",
    "pillow",
    "onnxruntime",
    "onnx",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
